name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
      - run: flutter --version
      - run: flutter pub get
      - run: flutter create . --org com.qand --project-name qand_app --platforms android || true
      - run: flutter analyze || true
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: qand-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: cp build/app/outputs/flutter-apk/app-release.apk qand-app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "قنادی قند - آخرین نسخه"
          body: "APK آماده نصب (اندروید 7 تا 17). بیلد خودکار از main."
          files: qand-app.apk
