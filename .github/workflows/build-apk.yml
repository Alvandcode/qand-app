name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter create . --org com.qand --project-name qand_app --platforms android || true
      - run: |
          sed -i 's/gradle-.*/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter analyze || true
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: qand-apk
          path: build/app/outputs/flutter-apk/app-release.apk
